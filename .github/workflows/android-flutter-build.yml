name: RoboLab Android build
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-flutter-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create . --platforms=android --project-name robolab_mobile
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=ROBOLAB_API=https://YOUR-ROBOLAB-HOST
      - name: Build AAB
        working-directory: mobile
        run: flutter build appbundle --release --dart-define=ROBOLAB_API=https://YOUR-ROBOLAB-HOST
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboLab-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RoboLab-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
