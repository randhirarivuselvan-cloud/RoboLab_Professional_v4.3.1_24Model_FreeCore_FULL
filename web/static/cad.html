<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab CAD Studio</title><link rel="stylesheet" href="/static/workspace.css"></head><body><aside><div class="brand">Robo<span>Lab</span></div><nav><a href="/static/index.html">🏠 Home</a><a href="/static/builder.html">🦾 Builder</a><a href="/static/circuit.html">🔌 Circuit</a><a href="/static/code.html">💻 Code</a><a href="/static/simulator.html">🧪 Simulator</a><a class="active" href="/static/cad.html">📐 CAD</a></nav></aside><main><header><div><p class="eyebrow">MECHANICAL ENGINEERING</p><h1>CAD Studio</h1><p class="muted">Dedicated mechanical design workspace.</p></div><a class="back" href="/static/index.html">← RoboLab Home</a></header><section class="workspace"><div class="panel"><h2>Project</h2><textarea id="project" placeholder="Describe the robot chassis or part you want to design..."></textarea><button onclick="generate()">Generate CAD</button><p id="status" class="muted"></p></div><div class="panel"><h2>OpenSCAD Output</h2><pre id="out">Your generated CAD code will appear here.</pre><button onclick="download()">Download .scad</button></div></section></main><script>let code='';async function generate(){let p=document.getElementById('project').value||'robot chassis';let s=document.getElementById('status');s.textContent='Generating…';let r=await fetch('/api/cad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:p})});let d=await r.json();code=d.code;document.getElementById('out').textContent=code;s.textContent='CAD generated: '+d.filename}function download(){if(!code)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download='robolab_generated.scad';a.click()}</script></body></html>
