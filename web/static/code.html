<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Code Studio</title><link rel="stylesheet" href="/static/workspace.css"></head><body><aside><div class="brand">Robo<span>Lab</span></div><nav><a href="/static/index.html">🏠 Home</a><a href="/static/builder.html">🦾 Builder</a><a href="/static/circuit.html">🔌 Circuit</a><a class="active" href="/static/code.html">💻 Code</a><a href="/static/simulator.html">🧪 Simulator</a><a href="/static/cad.html">📐 CAD</a></nav></aside><main><header><div><p class="eyebrow">SOFTWARE ENGINEERING</p><h1>Code Studio</h1><p class="muted">Dedicated firmware generation workspace.</p></div><a class="back" href="/static/index.html">← RoboLab Home</a></header><section class="workspace"><div class="panel"><h2>Generate firmware</h2><select id="platform"><option value="arduino">Arduino</option><option value="esp32">ESP32</option></select><textarea id="project" placeholder="Describe what the robot should do..."></textarea><button onclick="generate()">Generate Code</button></div><div class="panel"><h2>Generated Arduino C++</h2><pre id="out">Actual generated code will appear here.</pre><button onclick="download()">Download .ino</button></div></section></main><script>let code='';async function generate(){let p=document.getElementById('project').value||'robot project';let r=await fetch('/api/firmware',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:document.getElementById('platform').value,project:p})});let d=await r.json();code=d.code;document.getElementById('out').textContent=code}function download(){if(!code)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download='robolab_generated.ino';a.click()}</script></body></html>
