<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Simulation Lab</title><link rel="stylesheet" href="/static/workspace.css"></head><body><aside><div class="brand">Robo<span>Lab</span></div><nav><a href="/static/index.html">🏠 Home</a><a href="/static/builder.html">🦾 Builder</a><a href="/static/circuit.html">🔌 Circuit</a><a href="/static/code.html">💻 Code</a><a class="active" href="/static/simulator.html">🧪 Simulator</a><a href="/static/cad.html">📐 CAD</a></nav></aside><main><header><div><p class="eyebrow">ROBOTICS TESTING</p><h1>Simulation Lab</h1><p class="muted">Dedicated robot behavior testing workspace.</p></div><a class="back" href="/static/index.html">← RoboLab Home</a></header><section class="workspace"><div class="panel"><h2>Simulation setup</h2><textarea id="project" placeholder="Describe the robot to simulate..."></textarea><button onclick="run()">Run Simulation</button></div><div class="panel"><h2>Trajectory</h2><canvas id="canvas" width="700" height="350" style="max-width:100%;background:#050c14;border-radius:10px"></canvas><p id="note" class="muted"></p></div></section></main><script>async function run(){let p=document.getElementById('project').value||'robot';let r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:p,duration:10})});let d=await r.json(),c=document.getElementById('canvas'),x=c.getContext('2d'),xs=d.trajectory.x,ys=d.trajectory.y;x.clearRect(0,0,c.width,c.height);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),sx=600/Math.max(.001,maxX-minX),sy=260/Math.max(.001,maxY-minY);x.beginPath();xs.forEach((v,i)=>{let px=50+(v-minX)*sx,py=300-(ys[i]-minY)*sy;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();document.getElementById('note').textContent=d.note}</script></body></html>
