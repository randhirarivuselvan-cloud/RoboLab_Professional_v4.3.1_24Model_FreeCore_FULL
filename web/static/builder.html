<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Builder</title><link rel="stylesheet" href="/static/workspace.css"></head><body><aside><div class="brand">Robo<span>Lab</span></div><nav><a href="/static/index.html">🏠 Home</a><a class="active" href="/static/builder.html">🦾 Builder</a><a href="/static/circuit.html">🔌 Circuit</a><a href="/static/code.html">💻 Code</a><a href="/static/simulator.html">🧪 Simulator</a><a href="/static/cad.html">📐 CAD</a></nav></aside><main><header><div><p class="eyebrow">ROBOT ARCHITECTURE</p><h1>Robot Builder</h1><p class="muted">Dedicated project planning workspace.</p></div><a class="back" href="/static/index.html">← RoboLab Home</a></header><section class="workspace"><div class="panel"><h2>What are you building?</h2><textarea id="idea" placeholder="Describe your robot, requirements and budget..."></textarea><button onclick="plan()">Build Engineering Plan</button></div><div class="panel"><h2>Engineering Plan</h2><div id="out">Your plan will appear here.</div></div></section></main><script>async function plan(){let p=document.getElementById('idea').value||'robot';let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:p})});let d=await r.json();document.getElementById('out').innerHTML='<h3>'+p.replace(/[<>]/g,'')+'</h3><pre>'+JSON.stringify(d,null,2)+'</pre>'}</script></body></html>
