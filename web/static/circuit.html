<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboLab Circuit Designer</title><link rel="stylesheet" href="/static/workspace.css"></head><body><aside><div class="brand">Robo<span>Lab</span></div><nav><a href="/static/index.html">🏠 Home</a><a href="/static/builder.html">🦾 Builder</a><a class="active" href="/static/circuit.html">🔌 Circuit</a><a href="/static/code.html">💻 Code</a><a href="/static/simulator.html">🧪 Simulator</a><a href="/static/cad.html">📐 CAD</a></nav></aside><main><header><div><p class="eyebrow">ELECTRONICS ENGINEERING</p><h1>Circuit Designer</h1><p class="muted">Dedicated wiring and power workspace.</p></div><a class="back" href="/static/index.html">← RoboLab Home</a></header><section class="workspace"><div class="panel"><h2>Project</h2><textarea id="project" placeholder="Describe your robot circuit..."></textarea><button onclick="generate()">Generate Wiring</button></div><div class="panel"><h2>Circuit Preview</h2><div id="out" style="min-height:300px">Your circuit will appear here.</div></div></section></main><script>async function generate(){let p=document.getElementById('project').value||'robot';let r=await fetch('/api/circuit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:p})});document.getElementById('out').innerHTML=await r.text()}</script></body></html>
